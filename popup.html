<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ILIAS Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Theme Toggle Button (Minimalistische Vektor-Icons) -->
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Farbschema wechseln">
    <!-- Sun SVG (wird im Dark Mode angezeigt) -->
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <!-- Moon SVG (wird im Light Mode angezeigt) -->
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <!-- Hauptansicht -->
  <div id="main-view">
    <h3>Nächste Abgaben</h3>
    <div id="deadline-list" class="loader">Lade Daten von ILIAS...</div>
    <button id="btn-settings">Einstellungen</button>
  </div>

  <!-- Einstellungen -->
  <div id="settings-view">
    <h3>Module konfigurieren</h3>
    <div id="modules-container"></div>
    <button id="btn-add" class="btn-secondary">+ Weiteres Modul hinzufügen</button>

    <div class="discord-settings">
      <label>Discord Webhook URL (optional):</label>
      <input type="text" id="discord-webhook" placeholder="https://discord.com/api/webhooks/...">
      <button id="btn-send-discord" class="btn-discord">Übersicht an Discord senden</button>
    </div>

    <button id="btn-save">Speichern & Aktualisieren</button>
    <button id="btn-back" class="btn-secondary">Zurück</button>
  </div>

  <!-- Utilities -->
  <script src="js/time.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/render.js"></script>
  <script src="js/theme.js"></script>

  <!-- Features -->
  <script src="js/discord.js"></script>
  <script src="js/ilias.js"></script>
  <script src="js/settings.js"></script>

  <!-- Einstiegspunkt -->
  <script src="js/popup.js"></script>
</body>
</html>
